    <div class="container mt-5">
        <h2 class="text-center">Kapcsolat</h2>
        <p class="text-center">Lépjen velünk kapcsolatba az alábbi űrlapon keresztül!</p>
        <div class="row justify-content-center">
            <div class="col-md-6">
                <form>
                    <div class="mb-3">
                        <label for="name" class="form-label">Név</label>
                        <input type="text" class="form-control" id="name" placeholder="Írja be a nevét" required>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" placeholder="Írja be az email címét" required>
                    </div>
                    <div class="mb-3">
                        <label for="message" class="form-label">Üzenet</label>
                        <textarea class="form-control" id="message" rows="5" placeholder="Írja be az üzenetét" required></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Küldés</button>
                </form>
            </div>
        </div>

        <div class="mt-5">
            <h3 class="text-center">Elérhetőségünk</h3>
            <p class="text-center">Cím: 1234 Budapest, Példa utca 56.</p>
            <p class="text-center">Email: info@szszea.hu</p>
            <p class="text-center">Telefon: +36 1 234 5678</p>
            <div class="d-flex justify-content-center">

                    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d10612.676826394943!2d19.0402354!3d47.4979125!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x4741dc201a1a8d5b%3A0x400f7d1c6976a40!2sBudapest!5e0!3m2!1shu!2shu!4v1615123456789"
